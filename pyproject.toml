[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gauge-depth"
version = "0.1.0"
description = "Gauge-consistent sparse-reference depth calibration"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.scripts]
gauge-depth = "gauge_depth.cli:main"

[tool.setuptools.packages.find]
include = ["gauge_depth*"]
